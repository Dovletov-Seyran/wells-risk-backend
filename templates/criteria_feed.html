<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .criterion.CriterionName }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/style.css?v=2">
</head>

<body>
    <div class="phone">

        <main class="feed">
            <video class="feed__video" src="{{ .criterion.VideoURL }}" poster="{{ .criterion.ImageURL }}" autoplay muted
                loop playsinline></video>

            <div class="feed__shade"></div>

            <aside class="feed__side">
                <div class="feed__param">
                    <span class="feed__param-value">{{ .criterion.PointsLabel }}</span>
                    <span class="feed__param-label">баллов</span>
                </div>

                <div class="feed__param">
                    <span class="feed__param-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 12h6M9 16h6M9 8h6M5 3h14v18H5z" stroke-linecap="round" />
                        </svg>
                    </span>
                    <span class="feed__param-label">{{ .criterion.CriterionGroup }}</span>
                </div>

                <div class="feed__action">
                    <span class="feed__action-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 21s-8-4.6-8-10a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 11c0 5.4-8 10-8 10z" />
                        </svg>
                    </span>
                    <span class="feed__action-label">{{ .criterion.LikeCount }}</span>
                </div>

                <a class="feed__action" href="/criteria/feed/{{ .criterion.CriterionID }}?next=true">
                    <span class="feed__action-icon feed__action-icon--accent">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                </a>
            </aside>

            <div class="feed__bottom">
                <h1 class="feed__name">{{ .criterion.CriterionName }}</h1>

                <details class="feed__details">
                    <summary class="feed__summary">Подробнее</summary>
                    <p class="feed__description">{{ .criterion.ShortDescription }}</p>
                </details>
            </div>
        </main>

        {{ template "tabbar.html" . }}
    </div>
</body>

</html>
