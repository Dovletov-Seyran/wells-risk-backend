services:
  minio:
    image: minio/minio:latest
    container_name: wells-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:17-alpine
    container_name: wells-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wells_db
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6.2-alpine
    container_name: wells-redis
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass password
    volumes:
      - redis-data:/data

  adminer:
    image: adminer:latest
    container_name: wells-adminer
    ports:
      - "18081:8080"
    depends_on:
      - postgres

volumes:
  minio-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local