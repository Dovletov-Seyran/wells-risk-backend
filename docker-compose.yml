services:
  minio:
    image: minio/minio:latest
    container_name: wells-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:17-alpine
    container_name: wells-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wells_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: wells-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  minio-data:
    driver: local
  postgres-data:
    driver: local